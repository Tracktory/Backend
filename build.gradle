plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.4.0'
}

group = 'com.hansung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// === harness: 포매팅 게이트 (Spotless, Google Java Format) ===
// ratchetFrom 으로 이번 브랜치에서 변경한 파일만 검사 — 기존 코드 일괄 재포맷 방지.
// 기준은 통합 브랜치(develop). develop 에 이미 있는 코드는 grandfather, 새 작업만 포매팅 강제.
spotless {
	ratchetFrom 'origin/develop'
	java {
		googleJavaFormat()
		removeUnusedImports()
		formatAnnotations()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// === harness: 코드 스타일 검사 (Checkstyle) ===
// checkstyle.xml 이 severity=warning 기준이라 빌드를 막지 않고 리포트만 생성.
checkstyle {
	toolVersion = '10.21.4'
	configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
	ignoreFailures = true
	maxWarnings = Integer.MAX_VALUE
}

// === harness: 의존성 잠금 (재현 가능한 빌드) ===
// 갱신: ./gradlew dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
