spring:
  application:
    name: tracktory

  # application-secret.yaml
  config:
    import: optional:application-secret.yaml

  # Datasource
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

# AI 중계 서버 (내부 통신)
ai-relay:
  base-url: ${AI_RELAY_BASE_URL:http://localhost:8000}
  internal-token: ${AI_INTERNAL_TOKEN}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# 카탈로그 기준 데이터 적재 — 최초 1회 적재 시에만 true 로 켠다(기본 비활성).
# 활성 시 애플리케이션 구동 직후 classpath 의 catalog/*.yaml|json 을 읽어 테이블에 멱등 적재.
catalog:
  seed:
    enabled: true